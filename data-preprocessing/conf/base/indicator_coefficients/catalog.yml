# --------------

indicator_coefficients.blue_water#parquet:
  <<: *parquet
  filepath: s3://landgriffon-raw-data/processed/indicator_coefficients/bwfp_indicator_coefficients.csv

indicator_coefficient.grey_water#parquet:
  <<: *parquet
  filepath: s3://landgriffon-raw-data/processed/indicator_coefficients/gwfp_indicator_coefficients.csv

indicator_coefficients.h20#parquet:
  <<: *parquet
  filepath: s3://landgriffon-raw-data/processed/indicator_coefficients/impact_factors_water_commodities_H2O.csv

indicator_coefficients.wdl#parquet:
  <<: *parquet
  filepath: s3://landgriffon-raw-data/processed/indicator_coefficients/impact_factors_water_commodities_WDL.csv

indicator_coefficients.yeld#parquet:
