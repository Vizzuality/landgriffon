# This is a boilerplate parameters config generated for pipeline 'gadm'
# using Kedro 0.19.11.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/0.19.11/configuration/parameters.html

adm0:
  tolerance: 0.005  # 500 m

adm1:
  tolerance: 0.0001 # 10 m

adm2:
  tolerance: null

geo_region:
  column_map:
    geometry: theGeom
    GID_0: isoA3
  columns:
    - id
    - h3Compact
    - theGeom
    - isCreatedByUser

admin_region:
  column_map:
    GID_0: isoA3
  columns:
    - id
    - parentId
    - gadmId
    - level
    - name
    - description
    - status
    - isoA3
    - geoRegionId
    - mpath
