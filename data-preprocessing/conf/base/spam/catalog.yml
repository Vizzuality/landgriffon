# ——————————— SPAM Prod ———————————

spam.production:
  type: partitions.PartitionedDataset
  dataset:
    type: data_preprocessing.datasets.geotiff.GeoTIFFDataset
  credentials: s3_credentials
  path: s3://landgriffon-raw-data/raw/spam2020V1r0_global_production/
  filename_suffix: ".tif"

spam.production_h3_parts:
  type: partitions.PartitionedDataset
  path: data/02_intermediate/spam/production
  dataset:
    type: polars.EagerPolarsDataset
    file_format: parquet
  filename_suffix: ".parquet"


spam.production_h3:
  type: polars.EagerPolarsDataset
  filepath: s3://landgriffon-raw-data/processed/tables/spam/spam_prod.parquet
  file_format: parquet
  save_args:
    compression: "zstd"
    compression_level: 10
  credentials: s3_credentials

